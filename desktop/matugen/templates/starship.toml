palette = "matugen"
add_newline = false

format = "$username$hostname:$directory$git_branch$git_status $character"

[username]
show_always = true
style_user = "white bold"
style_root = "red bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "white bold"
format = "[@$hostname]($style)"

[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style)"

[git_branch]
symbol = ""
style = "magenta bold"
format = " [$branch]($style)"

[git_status]
style = "yellow"
format = " [$all_status$ahead_behind]($style)"

[character]
success_symbol = "[>](green bold)"
error_symbol = "[>](red bold)"
vicmd_symbol = "[<](yellow bold)"

[palettes.matugen]

blue      = "{{colors.primary.default.hex}}"
red       = "{{colors.error.default.hex}}"
green     = "{{colors.secondary.default.hex}}"
yellow    = "{{colors.tertiary.default.hex}}"
cyan      = "{{colors.tertiary.default.hex}}"
magenta   = "{{colors.secondary.default.hex}}"
white     = "{{colors.on_surface.default.hex}}"
black     = "{{colors.surface.default.hex}}"

# Extended palette (Catppuccin-compatible names)
rosewater = "{{colors.tertiary.default.hex}}"
flamingo  = "{{colors.error.default.hex}}"
pink      = "{{colors.secondary.default.hex}}"
mauve     = "{{colors.secondary.default.hex}}"
maroon    = "{{colors.error.default.hex}}"
peach     = "{{colors.tertiary.default.hex}}"
teal      = "{{colors.tertiary.default.hex}}"
sky       = "{{colors.tertiary.default.hex}}"
sapphire  = "{{colors.primary.default.hex}}"
lavender  = "{{colors.secondary.default.hex}}"

# Text shades
text      = "{{colors.on_surface.default.hex}}"
subtext1  = "{{colors.on_surface.default.hex}}"
subtext0  = "{{colors.outline.default.hex}}"

# Surface shades
overlay2  = "{{colors.outline.default.hex}}"
overlay1  = "{{colors.outline.default.hex}}"
overlay0  = "{{colors.surface.default.hex}}"
surface2  = "{{colors.surface.default.hex}}"
surface1  = "{{colors.surface.default.hex}}"
surface0  = "{{colors.surface_dim.default.hex}}"
base      = "{{colors.surface_dim.default.hex}}"
mantle    = "{{colors.surface_dim.default.hex}}"
crust     = "{{colors.surface_dim.default.hex}}"
