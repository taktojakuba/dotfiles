[config]

[templates.cava]
input_path = '~/.config/matugen/templates/cava.ini'
output_path = '~/.config/cava/themes/matugen'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'

[templates.vesktop]
input_path = '~/.config/matugen/templates/vesktop.ini'
output_path = '~/.config/vesktop/themes/matugen.css'

[templates.foot]
input_path = '~/.config/matugen/templates/foot.ini'
output_path = '~/.config/foot/matugen.ini'

[templates.dwl]
input_path = '~/.config/matugen/templates/dwl-colors.c'
output_path = '~/dwl/colors.c'

[templates.justbar]
input_path = '~/.config/matugen/templates/JustBar.toml'
output_path = '~/.config/justbar/config.toml'

[templates.mako]
input_path = '~/.config/matugen/templates/mako'
output_path = '~/.config/mako/config'
post_hook = 'makoctl reload'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim.lua'
output_path = '~/.config/nvim/lua/matugen.lua'
post_hook = 'pkill -USR1 nvim || true'

[templates.opencode]
input_path = '~/.config/matugen/templates/opencode.json'
output_path = '~/.config/opencode/themes/matugen.json'

[templates.qutebrowser]
input_path = '~/.config/matugen/templates/qutebrowser.py'
output_path = '~/.config/qutebrowser/matugen.py'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/matugen.rasi'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.homepage]
input_path = "~/.config/matugen/templates/main.css"
output_path = "~/.config/qutebrowser/main.css"
